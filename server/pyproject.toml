[project]
name = "sonar-server"
version = "0.1.0"
description = "Sonar single-server voice plaza and personal tasks"
requires-python = ">=3.12,<3.14"
dependencies = ["httpx>=0.28,<1", "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "pydantic-settings>=2.7,<3", "mcp>=1.12,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
